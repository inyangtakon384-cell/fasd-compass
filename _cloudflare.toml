# Cloudflare Pages configuration
# https://developers.cloudflare.com/pages/configuration/

[build]
  # No build command needed — pure static HTML app
  command = ""
  destination = "."

[build.environment]
  NODE_VERSION = "18"

# ── ROUTING ──────────────────────────────────────────────────────────
# Serve index.html for all routes (SPA fallback)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = false

# Explicit redirect: www → apex
[[redirects]]
  from = "https://www.myfasdguide.org/*"
  to = "https://myfasdguide.org/:splat"
  status = 301
  force = true

# ── HEADERS ──────────────────────────────────────────────────────────

# Service worker — must not be cached
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
    Service-Worker-Allowed = "/"

# Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=86400, stale-while-revalidate=3600"
    Content-Type = "application/manifest+json; charset=utf-8"

# Icons — immutable long cache (filenames include size so never clash)
[[headers]]
  for = "/icons/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Offline page — short cache so it can be updated
[[headers]]
  for = "/offline.html"
  [headers.values]
    Cache-Control = "public, max-age=86400"

# HTML — always revalidate
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# ── SECURITY HEADERS (applied to all routes) ─────────────────────────
[[headers]]
  for = "/*"
  [headers.values]

    # Force HTTPS for 2 years — submitted to browser preload lists
    Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"

    # Block clickjacking — no iframes allowed
    X-Frame-Options = "DENY"

    # Block MIME-type sniffing attacks
    X-Content-Type-Options = "nosniff"

    # Control referrer information sent to external sites
    Referrer-Policy = "strict-origin-when-cross-origin"

    # Restrict browser feature access
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=(), browsing-topics=()"

    # Cross-origin policies
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    Cross-Origin-Resource-Policy = "same-origin"

    # Content Security Policy
    # Allows: self, inline styles (needed for PWA), Google Fonts
    # Blocks: external scripts, frames, objects, eval
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; worker-src 'self' blob:; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests;"

    # Prevent cross-domain data leakage
    X-Permitted-Cross-Domain-Policies = "none"

    # DNS prefetch control
    X-DNS-Prefetch-Control = "off"
